[project]
name = "backend"
version = "0.1.0"
description = "Agentic E-Commerce Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "cloudinary>=1.40",
    "email-validator>=2.2",
    "fastapi>=0.143.0",
    "fastmcp>=4.1.0",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.33",
]
