[project]
name = "backend"
version = "0.1.0"
description = "Agentic E-Commerce Backend"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "cloudinary>=1.40",
    "email-validator>=2.2",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "fastmcp>=4.1.0",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pipecat-ai[daily,deepgram,google,openai,silero]>=1.12.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.33",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
